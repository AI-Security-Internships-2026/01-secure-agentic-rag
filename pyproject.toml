[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-rag"
version = "0.2.0"
description = "AuthInject-RAG: authorization-first agentic RAG under combined access-control and indirect prompt injection attacks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taha Bin Hanif" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "qdrant-client>=1.12.0",
  "numpy>=1.26.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "authzed>=0.18.0",
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "spacy>=3.7.0",
  "pypdf>=5.0.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "google-generativeai>=0.8.0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]
chroma-migrate = ["chromadb>=0.5.0"]

[project.scripts]
secure-rag = "secure_rag.cli:main"
secure-rag-api = "secure_rag.api.app:serve"
authinject-eval = "secure_rag.benchmark.runner:main"
authinject-analyze = "secure_rag.benchmark.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secure_rag = ["authz/schema.zed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
