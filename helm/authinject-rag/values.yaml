replicaCount: 2
image:
  repository: authinject-rag
  tag: "0.2.0"
service:
  port: 80
  targetPort: 8000
env:
  APP_ENV: production
  SPICEDB_ENDPOINT: spicedb:50051
  QDRANT_URL: http://qdrant:6333
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
audit:
  # "stdout" (default) or "file"; file mode writes /app/logs/audit.jsonl on the volume below.
  destination: stdout
  # Existing Secret holding AUDIT_HMAC_SECRET (>=32 chars); startup aborts without it.
  hmacSecret:
    name: authinject-secrets
    key: audit-hmac-secret
  # Disabled: in-memory emptyDir (64Mi). Enabled: a ReadWriteOnce PVC, which every
  # replica shares, so use it with replicaCount: 1 (one writer keeps one hash chain).
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ""
