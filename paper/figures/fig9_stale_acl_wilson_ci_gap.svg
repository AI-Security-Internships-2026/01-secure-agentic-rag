<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #64748b; text-anchor: middle; }
      .axis-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .tick { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4 4; }
      .ci-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .stat-badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #dc2626; }
      .anno-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .anno-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="400" y="32" class="title">Stale ACL Revocation: Structural Exposure with 95% Wilson CIs</text>
  <text x="400" y="52" class="subtitle">n = 40 stale ACL test cases (5 repeats, 3 LLMs) — Non-overlapping 95% Confidence Intervals</text>

  <!-- Plot Area -->
  <!-- X ranges 0 to 100% across 500px (150 to 650). 1% = 5px. -->
  <g transform="translate(150, 90)">
    <!-- Vertical Grid lines for 0%, 20%, 40%, 60%, 80%, 100% -->
    <line x1="0" y1="0" x2="0" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="240" class="tick" text-anchor="middle">0%</text>

    <line x1="100" y1="0" x2="100" y2="220" class="grid"/>
    <text x="100" y="240" class="tick" text-anchor="middle">20%</text>

    <line x1="200" y1="0" x2="200" y2="220" class="grid"/>
    <text x="200" y="240" class="tick" text-anchor="middle">40%</text>

    <line x1="300" y1="0" x2="300" y2="220" class="grid"/>
    <text x="300" y="240" class="tick" text-anchor="middle">60%</text>

    <line x1="400" y1="0" x2="400" y2="220" class="grid"/>
    <text x="400" y="240" class="tick" text-anchor="middle">80%</text>

    <line x1="500" y1="0" x2="500" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="500" y="240" class="tick" text-anchor="middle">100%</text>

    <text x="250" y="270" class="axis-label" text-anchor="middle">Structural Exposure Rate (%) [Lower is Better]</text>

    <!-- Row 1: B2 (Auth-First / AFR-only, No Continuous Auth) -->
    <!-- Point = 100% (500px), Wilson 95% CI = [91.2%, 100.0%] -> [456px, 500px] -->
    <g transform="translate(0, 60)">
      <text x="-10" y="5" font-family="'Segoe UI', Arial" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="end">B2: Auth-First (AFR-Only)</text>
      <!-- CI Error bar -->
      <line x1="456" y1="0" x2="500" y2="0" stroke="#dc2626" stroke-width="4"/>
      <!-- CI Caps -->
      <line x1="456" y1="-8" x2="456" y2="8" stroke="#dc2626" stroke-width="3"/>
      <line x1="500" y1="-8" x2="500" y2="8" stroke="#dc2626" stroke-width="3"/>
      <!-- Point -->
      <circle cx="500" cy="0" r="7" fill="#dc2626"/>
      <text x="478" y="-14" class="ci-label" fill="#dc2626">100.0% [91.2%, 100.0%]</text>
    </g>

    <!-- Row 2: P1 (Continuous Authorization / Memory Reval) -->
    <!-- Point = 0.0% (0px), Wilson 95% CI = [0.0%, 8.8%] -> [0px, 44px] -->
    <g transform="translate(0, 150)">
      <text x="-10" y="5" font-family="'Segoe UI', Arial" font-size="13" font-weight="bold" fill="#059669" text-anchor="end">P1: Continuous Auth (Proposed)</text>
      <!-- CI Error bar -->
      <line x1="0" y1="0" x2="44" y2="0" stroke="#059669" stroke-width="4"/>
      <!-- CI Caps -->
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#059669" stroke-width="3"/>
      <line x1="44" y1="-8" x2="44" y2="8" stroke="#059669" stroke-width="3"/>
      <!-- Point -->
      <circle cx="0" cy="0" r="7" fill="#059669"/>
      <text x="22" y="-14" class="ci-label" fill="#059669">0.0% [0.0%, 8.8%]</text>
    </g>
  </g>

  <!-- Statistical Significance Callout Box -->
  <g transform="translate(180, 310)">
    <rect width="440" height="90" class="anno-box"/>
    <text x="220" y="24" class="stat-badge" text-anchor="middle">McNemar Paired Test: p = 1.28 × 10⁻⁸ (p &lt; 0.001, Statistically Significant)</text>
    <text x="220" y="46" class="anno-text" text-anchor="middle">Absolute Exposure Difference: Δ = 100.0% [Wilson Non-Overlapping: 8.8% vs 91.2%]</text>
    <text x="220" y="68" class="anno-text" text-anchor="middle">Prior AFR baseline (Namboothiri et al.) suffers total policy bypass during multi-turn caching.</text>
  </g>
</svg>
