<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="425" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">Figure 4: Sequence of Continuous Authorization Cross-Turn Memory Revalidation</text>
  
  <!-- Lifelines -->
  <line x1="120" y1="70" x2="120" y2="460" stroke="#9ca3af" stroke-dasharray="4"/>
  <line x1="320" y1="70" x2="320" y2="460" stroke="#9ca3af" stroke-dasharray="4"/>
  <line x1="520" y1="70" x2="520" y2="460" stroke="#9ca3af" stroke-dasharray="4"/>
  <line x1="720" y1="70" x2="720" y2="460" stroke="#9ca3af" stroke-dasharray="4"/>
  
  <!-- Entity Boxes -->
  <rect x="60" y="50" width="120" height="36" fill="#e0e7ff" stroke="#4f46e5" rx="4"/><text x="120" y="73" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#312e81">User (Alice)</text>
  <rect x="260" y="50" width="120" height="36" fill="#e0e7ff" stroke="#4f46e5" rx="4"/><text x="320" y="73" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#312e81">LangGraph Agent</text>
  <rect x="460" y="50" width="120" height="36" fill="#e0e7ff" stroke="#4f46e5" rx="4"/><text x="520" y="73" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#312e81">SpiceDB (ReBAC)</text>
  <rect x="660" y="50" width="120" height="36" fill="#e0e7ff" stroke="#4f46e5" rx="4"/><text x="720" y="73" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#312e81">Qdrant Vector DB</text>

  <!-- Turn 0 -->
  <rect x="40" y="105" width="770" height="90" fill="#f0fdf4" stroke="#86efac" rx="6"/>
  <text x="50" y="125" font-family="Arial" font-size="11" font-weight="bold" fill="#15803d">Turn 0 (Time T0: Authorized Retrieval)</text>
  <line x1="120" y1="145" x2="320" y2="145" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="140" font-family="Arial" font-size="10" text-anchor="middle">1. Query Q0</text>
  <line x1="320" y1="160" x2="520" y2="160" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="155" font-family="Arial" font-size="10" text-anchor="middle">2. Check ACL (docA#viewer@alice)</text>
  <line x1="520" y1="175" x2="320" y2="175" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3"/>
  <text x="420" y="170" font-family="Arial" font-size="10" text-anchor="middle">ALLOWED (Policy v1)</text>
  <line x1="320" y1="185" x2="720" y2="185" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="180" font-family="Arial" font-size="10" text-anchor="middle">3. Retrieve ChunkRef(docA, v1)</text>

  <!-- Turn 1 (Revocation) -->
  <rect x="40" y="210" width="770" height="60" fill="#fef2f2" stroke="#fca5a5" rx="6"/>
  <text x="50" y="230" font-family="Arial" font-size="11" font-weight="bold" fill="#b91c1c">Turn 1 (Time T1: Policy Revocation Event)</text>
  <line x1="120" y1="250" x2="520" y2="250" stroke="#dc2626" stroke-width="2"/>
  <text x="320" y="245" font-family="Arial" font-size="10" text-anchor="middle">Admin deletes (document:docA#viewer@user:alice) -> Policy v2 Triggered</text>

  <!-- Turn 2 (Continuous Auth Revalidation) -->
  <rect x="40" y="285" width="770" height="150" fill="#eff6ff" stroke="#93c5fd" rx="6"/>
  <text x="50" y="305" font-family="Arial" font-size="11" font-weight="bold" fill="#1d4ed8">Turn 2 (Time T2: Memory Reuse &amp; Continuous Revalidation)</text>
  <line x1="120" y1="325" x2="320" y2="325" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="320" font-family="Arial" font-size="10" text-anchor="middle">4. Follow-up Query Q1 (carries prior_contexts)</text>
  <line x1="320" y1="350" x2="520" y2="350" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="345" font-family="Arial" font-size="10" text-anchor="middle">5. Revalidate ChunkRef(docA) at Policy v2</text>
  <line x1="520" y1="375" x2="320" y2="375" stroke="#dc2626" stroke-width="2" stroke-dasharray="3"/>
  <text x="420" y="370" font-family="Arial" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">DENIED (Revocation Detected)</text>
  <rect x="250" y="390" width="140" height="25" fill="#fee2e2" stroke="#ef4444" rx="3"/>
  <text x="320" y="407" font-family="Arial" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">DROP STALE CHUNK</text>
  <line x1="320" y1="425" x2="120" y2="425" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="420" font-family="Arial" font-size="10" text-anchor="middle">6. Safe Answer (Grounded Only on Authorized Context)</text>
</svg>
