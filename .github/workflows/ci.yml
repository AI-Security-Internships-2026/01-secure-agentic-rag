name: CI

on:
  push:
    branches: [main, dev, "week-*"]
  pull_request:
    branches: [main, dev, "week-*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: test
  EMBED_BACKEND: hash
  QDRANT_IN_MEMORY: "true"
  AUDIT_OUTPUT_DESTINATION: stdout
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff==0.16.10"

      # Blocking: syntax errors, undefined names and other bugs that break at runtime.
      - name: Ruff (errors)
        run: ruff check --select E9,F63,F7,F82 --output-format github .

      # Advisory until the existing backlog (unused imports, blind excepts, 19 unformatted
      # files) is cleaned up; flip continue-on-error off once `ruff check .` is clean.
      - name: Ruff (full rule set, advisory)
        run: ruff check --output-format github .
        continue-on-error: true

      - name: Ruff format (advisory)
        run: ruff format --check .
        continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Presidio's NLP engine loads en_core_web_sm (secure_rag/retrieval/pii.py).
      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Type check (advisory)
        run: mypy src/secure_rag
        continue-on-error: true

      # tests/conftest.py pins APP_ENV=test, hash embeddings and in-memory Qdrant, and the
      # authz client uses the in-process SpiceDB simulator, so no services are needed.
      # There are no tests against live SpiceDB/Qdrant yet; add a services job when there are.
      - name: Pytest
        run: python -m pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: pytest-report.xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build image
        run: docker build -t "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" .
