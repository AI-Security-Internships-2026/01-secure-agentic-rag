name: CI

on:
  push:
    branches: [main, dev, "week-*"]
  pull_request:
    branches: [main, dev, "week-*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      APP_ENV: test
      EMBED_BACKEND: hash
      QDRANT_IN_MEMORY: "true"
      JWT_SECRET: ci-secret-key-32-chars-minimum-secure
      SPICEDB_PRESHARED_KEY: foobar
      SPICEDB_ENDPOINT: 127.0.0.1:50051
      QDRANT_URL: http://127.0.0.1:6333
      AUDIT_OUTPUT_DESTINATION: stdout

    steps:
      # Stage 1 — Setup
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Stage 2 — Lint + Format
      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Type check with Mypy
        run: mypy src/secure_rag --ignore-missing-imports
        continue-on-error: true

      # Stage 3 — Unit Tests (SpiceDB/Qdrant simulator)
      - name: Run Unit Tests
        env:
          APP_ENV: test
          QDRANT_IN_MEMORY: "true"
        run: |
          pytest tests/ -x -v --ignore=tests/test_api_authz.py --ignore=tests/test_query.py

      # Stage 4 — Integration Tests (Docker Compose Backing Services)
      - name: Start Docker Compose services
        run: |
          docker compose up -d postgres spicedb qdrant
          echo "Waiting for services to become healthy..."
          timeout 60s bash -c 'until curl -s -f http://127.0.0.1:6333/dashboard > /dev/null; do sleep 2; done' || true
          sleep 5

      - name: Run Integration Tests
        env:
          APP_ENV: test
          QDRANT_IN_MEMORY: "true"
        run: |
          pytest tests/test_api_authz.py tests/test_query.py -x -v

      - name: Run Full Test Suite & Benchmark Smoke
        env:
          APP_ENV: test
          QDRANT_IN_MEMORY: "true"
        run: |
          pytest tests/ -x -v
          python -m secure_rag.benchmark.runner --repeats 1 --split test --out experiments/results/authinject_eval.json

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

      # Stage 5 — Docker Build
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
