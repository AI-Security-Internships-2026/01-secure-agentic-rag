name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      EMBED_BACKEND: hash
      QDRANT_IN_MEMORY: "true"
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests -q
      - name: Offline benchmark smoke
        run: python -m secure_rag.benchmark.runner --repeats 1 --split test --out experiments/results/authinject_eval.json
