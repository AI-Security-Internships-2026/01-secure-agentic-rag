version: "3.8"

services:
  spicedb:
    image: authzed/spicedb:v1.35.3@sha256:4d8a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a
    container_name: authinject-ae-spicedb
    ports:
      - "50051:50051"
      - "8443:8443"
    environment:
      - SPICEDB_GRPC_PRESHARED_KEY=test-preshared-key
      - SPICEDB_DATASTORE_ENGINE=memory
    command: serve --grpc-preshared-key test-preshared-key --datastore-engine memory

  qdrant:
    image: qdrant/qdrant:v1.11.0@sha256:1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
    container_name: authinject-ae-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  api:
    image: ghcr.io/ai-security-internships-2026/01-secure-agentic-rag:v0.3.0@sha256:7f9a1c8b3e2a4d5f6c7e8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d
    container_name: authinject-ae-api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - SPICEDB_ENDPOINT=spicedb:50051
      - SPICEDB_TOKEN=test-preshared-key
      - QDRANT_URL=http://qdrant:6333
      - JWT_SECRET=ae-evaluation-insecure-test-secret-change-in-prod
    depends_on:
      - spicedb
      - qdrant
